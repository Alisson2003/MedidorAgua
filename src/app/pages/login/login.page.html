<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <ion-input placeholder="Email" [(ngModel)]="email"></ion-input>
  <ion-input placeholder="Contraseña" [(ngModel)]="password" type="password"></ion-input>

  <ion-button expand="full" (click)="login()">Ingresar</ion-button>
  <ion-button expand="full" (click)="registrar()">Registrarse</ion-button>

</ion-content>
