<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar sesion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Email</ion-label>
    <ion-input [(ngModel)]="email" type="email"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Password</ion-label>
    <ion-input [(ngModel)]="password" type="password"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label>Rol</ion-label>
    <ion-select [(ngModel)]="rol">
      <ion-select-option value="admin">Admin</ion-select-option>
      <ion-select-option value="user">User</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-button expand="full" color="primary" (click)="login()">
    Iniciar sesión
  </ion-button>

  <ion-button expand="full" color="secondary" (click)="register()">
    Registrar
  </ion-button>
</ion-content>
