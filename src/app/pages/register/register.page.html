<ion-header>
  <ion-toolbar>
    <ion-title>Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-input placeholder="Email" [(ngModel)]="email"></ion-input>
  <ion-input placeholder="Contraseña" [(ngModel)]="password" type="password"></ion-input>

  <ion-label>Selecciona tu rol</ion-label>
  <ion-select [(ngModel)]="rol">
    <ion-select-option value="medidor">Medidor</ion-select-option>
    <ion-select-option value="admin">Admin</ion-select-option>
  </ion-select>

  <ion-button expand="full" color="primary" (click)="registrar()">Registrarse</ion-button>
  
</ion-content>
