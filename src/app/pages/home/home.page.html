<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Mis Lecturas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-button expand="full" color="primary" [routerLink]="'/nueva-lectura'">
    Registrar nueva lectura
  </ion-button>

  <ion-list>
    <ion-item *ngFor="let lectura of lecturas">
      <ion-label>
        <h2>Valor: {{ lectura.valor }}</h2>
        <p>Observaciones: {{ lectura.observaciones }}</p>
        <p>Fecha: {{ lectura.created_at | date:'short' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
