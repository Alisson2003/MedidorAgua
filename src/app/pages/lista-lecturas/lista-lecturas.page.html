<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Lecturas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card *ngFor="let l of lecturas">
    <ion-card-header>
      <ion-card-title>{{ l.valor_medidor }}</ion-card-title>
      <ion-card-subtitle>{{ l.created_at | date }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <p>{{ l.observaciones }}</p>
      <p>📍 <a [href]="l.maps_link" target="_blank">Ver en Google Maps</a></p>
      <img [src]="l.foto_medidor" width="100%">
      <img [src]="l.foto_fachada" width="100%">
    </ion-card-content>
  </ion-card>
</ion-content>
