<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Lecturas Registradas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>
    <ion-item *ngFor="let l of lecturas">
      <ion-label>
        <h2>Valor: {{ l.valor }}</h2>
        <p>Obs: {{ l.observacion }}</p>
        <p>
          <a target="_blank" [href]="'https://maps.google.com/?q=' + l.latitud + ',' + l.longitud">
            Ver en Google Maps
          </a>
        </p>
      </ion-label>

      <img width="60" [src]="l.url_medidor" />
    </ion-item>

  </ion-list>

</ion-content>
