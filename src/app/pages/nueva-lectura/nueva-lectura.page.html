<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Nueva Lectura</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-label position="floating">Valor del Medidor</ion-label>
    <ion-input type="text" [(ngModel)]="valorMedidor"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Observaciones</ion-label>
    <ion-textarea [(ngModel)]="observaciones"></ion-textarea>
  </ion-item>

  <ion-item>
    <ion-label>Foto del Medidor</ion-label>
    <input type="file" (change)="onFotoMedidorChange($event)" />
  </ion-item>

  <ion-item>
    <ion-label>Foto de la Fachada</ion-label>
    <input type="file" (change)="onFotoFachadaChange($event)" />
  </ion-item>

  <ion-item>
    <ion-label>Latitud: {{ latitud }}</ion-label>
  </ion-item>
  <ion-item>
    <ion-label>Longitud: {{ longitud }}</ion-label>
  </ion-item>

  <ion-button expand="full" color="success" (click)="guardarLectura()">
    Guardar Lectura
  </ion-button>

</ion-content>
