<ion-header>
  <ion-toolbar>
    <ion-title>Nueva Lectura</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-label position="floating">Valor del Medidor</ion-label>
    <ion-input [(ngModel)]="valorMedidor"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Observaciones</ion-label>
    <ion-textarea [(ngModel)]="observaciones"></ion-textarea>
  </ion-item>

  <ion-button expand="full" (click)="tomarFotoMedidor()">
    Tomar foto del Medidor
  </ion-button>

  <ion-button expand="full" (click)="tomarFotoFachada()">
    Tomar foto de la Fachada
  </ion-button>

  <ion-item>
    <ion-label>Ubicación actual</ion-label>
    <ion-text>Lat: {{lat}} — Lng: {{lng}}</ion-text>
    <ion-button slot="end" (click)="obtenerGps()">Obtener GPS</ion-button>
  </ion-item>

  <ion-button expand="full" (click)="guardarLectura()">
    Guardar Lectura
  </ion-button>

</ion-content>
